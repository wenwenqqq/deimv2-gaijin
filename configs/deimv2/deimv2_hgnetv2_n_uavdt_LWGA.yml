# ==============================================================================
# DEIMv2 + HGNetv2 B0 on UAVDT with LWGA decoder self-attention
#   Based on configs/deimv2/deimv2_hgnetv2_n_uavdt.yml.
#   Only the decoder is changed from DEIMTransformer to DEIMTransformer_LWGA.
#
#   LWGA replaces decoder query self-attention. Cross-attention remains the
#   original MSDeformableAttention to preserve multi-scale reference-point
#   sampling.
#
# Training Command:
#   CUDA_VISIBLE_DEVICES=2 python train.py \
#       -c /workspace/cpfs-data/deimv2/configs/deimv2/deimv2_hgnetv2_n_uavdt_LWGA.yml \
#       --use-amp --seed=0
# ==============================================================================
__include__: [
  '../dataset/uavdt_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/deimv2.yml'
]

output_dir: ./outputs/deimv2_hgnetv2_n_uavdt_LWGA

DEIM:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DEIMTransformer_LWGA

HGNetv2:
  name: 'B0'
  return_idx: [2, 3]
  freeze_at: -1
  freeze_norm: False
  pretrained: False
  use_lab: True

HybridEncoder:
  in_channels: [512, 1024]
  feat_strides: [16, 32]

  # intra
  hidden_dim: 128
  use_encoder_idx: [1]
  dim_feedforward: 512

  # cross
  expansion: 0.34
  depth_mult: 0.5

  version: 'dfine'

DEIMTransformer_LWGA:
  feat_channels: [128, 128]
  feat_strides: [16, 32]
  hidden_dim: 128
  num_levels: 2
  num_points: [6, 6]

  num_layers: 3
  eval_idx: -1

  # FFN
  dim_feedforward: 512

  # LWGA token self-attention
  lwga_stage: 3
  lwga_att_kernel: 11
  lwga_mlp_ratio: 2.0
  lwga_drop_path: 0.0
  lwga_act: 'gelu'
  lwga_norm_type: 'GN'
  lwga_min_hw: 2
  lwga_sort_by_ref: True
  lwga_isolate_dn: True

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0004
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0004
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0008
  betas: [0.9, 0.999]
  weight_decay: 0.0001

# Increase to search for the optimal ema
epoches: 160 # 148 + 12

## Our LR-Scheduler
flat_epoch: 7800    # 4 + epoch // 2, e.g., 40 = 4 + 72 / 2
no_aug_epoch: 12
lr_gamma: 1.0

## Our DataAug
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: [4, 78, 148]   # list

  collate_fn:
    ema_restart_decay: 0.9999
    base_size_repeat: ~
    mixup_epochs: [4, 78]
    stop_epoch: 148
    copyblend_prob: 0.4
    copyblend_epochs: [4, 78]   # CP half
    area_threshold: 100
    num_objects: 3
    with_expand: True
    expand_ratios: [0.1, 0.25]

DEIMCriterion:
  weight_dict: {loss_mal: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5,
                loss_paq_vfl: 1, loss_paq_bbox: 5, loss_paq_giou: 2}
  # PaQ-DETR quality-aware one-to-many auxiliary branch (ablation toggle).
  # Off by default in code; set paq_enable: True to turn on. Final decoder layer
  # always stays one-to-one; this adds an adaptive one-to-many loss at the
  # intermediate (aux) decoder layers only.
  paq_enable: True
  paq_gamma: 0.4
  paq_k: 4
  paq_l: 1
  paq_iou_thr: 0.0
  paq_layers: ~
  paq_start_epoch: 4
  matcher:
    # new matcher
    change_matcher: True
    iou_order_alpha: 4.0
    matcher_change_epoch: 136
