# ==============================================================================
# DEIMv2 + HGNetv2 B0 on UAVDT with Combo encoder (HFP + PFG, 异层分工)
#   HFP @ stride-16 (high-res DCT high-pass for tiny objects)
#   PFG @ stride-32 (deep large-RF frequency-gated token mixing)
#   Both replace the single intra-scale TransformerEncoder; FPN/PAN unchanged.
#   Based on deimv2_hgnetv2_n_uavdt.yml; include swapped to base/deimv2_encoder_Combo.yml.
#
#   Dependency: HFP's DCT path (hsfpn_isdct=True) requires `torch_dct`:
#       pip install torch_dct
#
# Training Command:
#   CUDA_VISIBLE_DEVICES=0 python train.py \
#       -c /workspace/cpfs-data/deimv2/configs/deimv2/deimv2_hgnetv2_n_uavdt_Combo.yml \
#       --use-amp --seed=0
# ==============================================================================
__include__: [
  '../dataset/uavdt_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/deimv2_encoder_Combo.yml'
]

output_dir: ./outputs/deimv2_hgnetv2_n_uavdt_Combo

HGNetv2:
  name: 'B0'
  return_idx: [2, 3]
  freeze_at: -1
  freeze_norm: False
  pretrained: False
  use_lab: True

HybridEncoder_Combo:
  in_channels: [512, 1024]
  feat_strides: [16, 32]

  # intra
  hidden_dim: 128
  # both levels get an intra-scale block (baseline TE was only at [1]=stride-32)
  use_encoder_idx: [0, 1]
  num_encoder_layers: 1
  dim_feedforward: 512

  # cross
  expansion: 0.34
  depth_mult: 0.5

  version: 'dfine'

  # ---- combo assignment: HFP on stride-16, PFG on stride-32 ----
  encoder_types: ['hfp', 'pfg']

  # HFP @ stride-16 (high-res high-freq)
  hsfpn_depth: 2
  hsfpn_ratio: [0.25, 0.25] # DCT high-pass: zero the top-left 25% low-freq block
  hsfpn_patch: [8, 8]       # channel-path adaptive-pool target
  hsfpn_isdct: True         # use real DCT high-pass (needs torch_dct)
  hsfpn_residual: True      # residual around each HFP block for stable stacking
  # ---- Lightweight-HFP (idea-preserving simplification) ----
  # The HS-FPN idea (DCT high-pass + spatial/channel masking) is parameter-free;
  # the original 'conv3x3' output projection alone was ~100% of the block's
  # params/MACs. 'dw_pw' replaces it with a factored dw3x3+pw1x1+GN
  # (~8x fewer params, ~8x fewer MACs, same expressiveness shape). share_dct
  # computes the DCT high-pass once, shared by the spatial & channel paths
  # (identical masks, ~halves DCT runtime). Ablate by flipping these two.
  hsfpn_out_mode: 'dw_pw'   # 'conv3x3' (baseline) | 'dw_pw' | 'dw' | '1x1' | 'none'
  hsfpn_share_dct: True     # share one DCT/IDCT pair between spatial & channel

  # PFG @ stride-32 (deep large-RF mixing)
  pfg_depth: 2
  pfga_K: [9, 15, 31]
  center_suppress: False
  mlp_ratio: 2.0
  dw_kernel: 3
  groups_pw: 1
  layerscale_init: 0.000001
  pfg_drop: 0.0
  pfg_drop_path: 0.0
  use_grn: False

DEIMTransformer:
  feat_channels: [128, 128]
  feat_strides: [16, 32]
  hidden_dim: 128
  num_levels: 2
  num_points: [6, 6]

  num_layers: 3
  eval_idx: -1

  # FFN
  dim_feedforward: 512

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0004
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0004
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0008
  betas: [0.9, 0.999]
  weight_decay: 0.0001

# Increase to search for the optimal ema
epoches: 160 # 148 + 12

## Our LR-Scheduler
flat_epoch: 7800    # 4 + epoch // 2, e.g., 40 = 4 + 72 / 2
no_aug_epoch: 12
lr_gamma: 1.0

## Our DataAug
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: [4, 78, 148]   # list

  collate_fn:
    ema_restart_decay: 0.9999
    base_size_repeat: ~
    mixup_epochs: [4, 78]
    stop_epoch: 148
    copyblend_prob: 0.4
    copyblend_epochs: [4, 78]   # CP half
    area_threshold: 100
    num_objects: 3
    with_expand: True
    expand_ratios: [0.1, 0.25]

DEIMCriterion:
  matcher:
    # new matcher
    change_matcher: True
    iou_order_alpha: 4.0
    matcher_change_epoch: 136
