# ==============================================================================
# DEIMv2 + block-level MoE v2 HGNetv2 B0 + HSFPN encoder on UAVDT
#   Combines:
#     - configs/deimv2/deimv2_hgnetv2_moe_v2_n_uavdt.yml
#       (HGNetv2_MoE_v2 backbone, MoE optimizer groups, auxiliary MoE loss)
#     - configs/deimv2/deimv2_hgnetv2_n_uavdt_HSFPN.yml
#       (HybridEncoder_HSFPN with HFP on stride-16)
#
#   HFP keeps the lightweight HSFPN setting from the standalone HSFPN experiment:
#   dw3x3+pw1x1 output projection and shared DCT path.
#
#   Dependency: the DCT path (hsfpn_isdct=True) requires `torch_dct`:
#       pip install torch_dct
#
# Training Command:
#   CUDA_VISIBLE_DEVICES=2 python train.py \
#       -c /workspace/cpfs-data/deimv2/configs/deimv2/deimv2_hgnetv2_moe_v2_n_uavdt_HSFPN.yml \
#       --use-amp --seed=0
# ==============================================================================
__include__: [
  '../dataset/uavdt_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/deimv2_encoder_HSFPN.yml'
]

output_dir: ./outputs/deimv2_hgnetv2_moe_v2_n_uavdt_HSFPN

# MoE expert branches use conditional BN; SyncBN can hang when different ranks
# activate different experts.
sync_bn: False

DEIM:
  backbone: HGNetv2_MoE_v2
  encoder: HybridEncoder_HSFPN
  decoder: DEIMTransformer

# ==============================================================================
# Block-level MoE v2 Backbone (same UAVDT setting as the standalone MoE v2 run)
# ==============================================================================
HGNetv2_MoE_v2:
  name: 'B0'
  return_idx: [2, 3]
  freeze_at: -1
  freeze_norm: False
  pretrained: False
  use_lab: True
  num_experts: 3
  top_k: 2
  use_shared_expert: True
  moe_stages: [3]
  expert_kernels: [3, 5, 7]
  expert_act: 'silu'
  expert_expand_ratio: 1
  balance_loss_coeff: 1.0
  z_loss_coeff: 1.0

HybridEncoder_HSFPN:
  in_channels: [512, 1024]
  feat_strides: [16, 32]

  # intra
  hidden_dim: 128
  # HFP runs on the high-resolution level (stride-16), matching the standalone
  # HSFPN experiment and avoiding extra cost on the MoE stride-32 stage.
  use_encoder_idx: [0]
  num_encoder_layers: 1
  dim_feedforward: 512

  # cross
  expansion: 0.34
  depth_mult: 0.5

  version: 'dfine'

  # HFP-specific
  hsfpn_depth: 1
  hsfpn_ratio: [0.25, 0.25]
  hsfpn_patch: [8, 8]
  hsfpn_isdct: True
  hsfpn_residual: True
  hsfpn_out_mode: 'dw_pw'
  hsfpn_share_dct: True

DEIMTransformer:
  feat_channels: [128, 128]
  feat_strides: [16, 32]
  hidden_dim: 128
  num_levels: 2
  num_points: [6, 6]

  num_layers: 3
  eval_idx: -1

  # FFN
  dim_feedforward: 512

# ==============================================================================
# Optimizer with MoE parameter groups
# ==============================================================================
optimizer:
  type: AdamW
  params:
    # Backbone norm/bn params
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0004
      weight_decay: 0.
    # Backbone MoE params (expert, router, shared_expert) - exclude norm/bn
    -
      params: '^(?=.*backbone)(?=.*(?:expert|router|shared_expert|gate))(?!.*norm|bn).*$'
      lr: 0.0004
    # Backbone other params (exclude norm/bn and MoE params)
    -
      params: '^(?=.*backbone)(?!.*norm|bn)(?!.*expert)(?!.*router)(?!.*shared_expert)(?!.*gate).*$'
      lr: 0.0004
    # Encoder/Decoder norm/bn/bias params
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0008
  betas: [0.9, 0.999]
  weight_decay: 0.0001

# Training Schedule (for UAVDT)
epoches: 160

flat_epoch: 7800
no_aug_epoch: 12
lr_gamma: 1.0

## MoE Loss Weight
moe_loss_weight: 0.01

## DataAug
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: [4, 78, 148]

  collate_fn:
    ema_restart_decay: 0.9999
    base_size_repeat: ~
    mixup_epochs: [4, 78]
    stop_epoch: 148
    copyblend_prob: 0.4
    copyblend_epochs: [4, 78]
    area_threshold: 100
    num_objects: 3
    with_expand: True
    expand_ratios: [0.1, 0.25]

DEIMCriterion:
  matcher:
    change_matcher: True
    iou_order_alpha: 4.0
    matcher_change_epoch: 136
