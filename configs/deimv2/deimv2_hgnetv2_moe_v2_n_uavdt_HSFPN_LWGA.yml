# ==============================================================================
# DEIMv2 + block-level MoE v2 HGNetv2 B0 + HSFPN encoder + LWGA decoder on UAVDT
#   Combines three single-component improvements into one experiment:
#     * backbone : HGNetv2_MoE_v2 (block-level ES-MoE v2, YOLO-Master style;
#                                    heterogeneous multi-kernel experts at stage4)
#     * encoder  : HybridEncoder_HSFPN (HFP replaces the intra-scale
#                                        TransformerEncoder; DCT high-pass for
#                                        tiny-object high-frequency cues)
#     * decoder  : DEIMTransformer_LWGA (LWGA replaces decoder query
#                                        self-attention; cross-attention stays
#                                        MSDeformableAttention)
#
#   This config is the union of two already-validated 2-way combos:
#     - configs/deimv2/deimv2_hgnetv2_moe_v2_n_uavdt_HSFPN.yml   (MoE v2 + HSFPN)
#     - configs/deimv2/deimv2_hgnetv2_n_uavdt_HSFPN_LWGA.yml      (HSFPN + LWGA)
#
#   Backbone side is taken verbatim from the MoE v2 + HSFPN run (MoE optimizer
#   param groups, sync_bn=False for conditional-expert BN, auxiliary MoE loss).
#   Encoder side is taken verbatim from both HSFPN runs (effect-first HFP at
#   use_encoder_idx=[0]=stride-16, dw_pw output proj, shared DCT). Decoder side
#   is taken verbatim from the HSFPN + LWGA run (stage-3 LWGA, kernel 11) plus
#   the PaQ-DETR one-to-many auxiliary loss (criterion-level, decoder-agnostic).
#
#   ABLATION PAIR (arm A / baseline): this file uses hsfpn_out_mode='dw_pw'.
#     arm B (sibling): deimv2_hgnetv2_moe_v2_n_uavdt_HSFPN_LWGA_dw.yml
#       -> hsfpn_out_mode='dw' (drops the pw1x1 channel mix of the HFP output
#          projection; MoE v2 + HSFPN + LWGA otherwise identical). Compare the
#          two output_dir's to read the dw_pw vs dw trade on the 3-way combo.
#
#   Dependency: the DCT path (hsfpn_isdct=True) requires `torch_dct`:
#       pip install torch_dct
#
# Training Command (from scratch; single node, 2 GPUs):
#   CUDA_VISIBLE_DEVICES=0,1 torchrun --nproc_per_node=2 --master_port=29500 \
#       train.py \
#       -c /workspace/cpfs-data/deimv2/configs/deimv2/deimv2_hgnetv2_moe_v2_n_uavdt_HSFPN_LWGA.yml \
#       --use-amp --seed=0
# ==============================================================================
__include__: [
  '../dataset/uavdt_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/deimv2_encoder_HSFPN.yml'
]

output_dir: ./outputs/deimv2_hgnetv2_moe_v2_n_uavdt_HSFPN_LWGA

# MoE expert branches use conditional BN; SyncBN can hang when different ranks
# activate different experts.
sync_bn: False

DEIM:
  backbone: HGNetv2_MoE_v2
  encoder: HybridEncoder_HSFPN
  decoder: DEIMTransformer_LWGA

# ==============================================================================
# Block-level MoE v2 Backbone (same UAVDT setting as the standalone MoE v2 run)
#   Only stage4 (stride-32, 20x20) uses whole-block MoE for the lightweight start.
# ==============================================================================
HGNetv2_MoE_v2:
  name: 'B0'
  return_idx: [2, 3]
  freeze_at: -1
  freeze_norm: False
  pretrained: False
  use_lab: True
  num_experts: 3
  top_k: 2
  use_shared_expert: True
  moe_stages: [3]            # only stage4 (stride-32, 20x20): cheapest, +~real MoE
  expert_kernels: [3, 5, 7]  # heterogeneous multi-kernel experts
  expert_act: 'silu'         # YOLO-Master style (decoupled from backbone relu)
  expert_expand_ratio: 1     # hidden = mid_channels (lightweight)
  balance_loss_coeff: 1.0
  z_loss_coeff: 1.0

HybridEncoder_HSFPN:
  in_channels: [512, 1024]
  feat_strides: [16, 32]

  # intra
  hidden_dim: 128
  # HFP runs on the high-resolution level (stride-16), matching the standalone
  # HSFPN experiment and avoiding extra cost on the MoE stride-32 stage.
  use_encoder_idx: [0]
  num_encoder_layers: 1
  dim_feedforward: 512

  # cross
  expansion: 0.34
  depth_mult: 0.5

  version: 'dfine'

  # HFP-specific
  hsfpn_depth: 1            # HFP block replaces the single intra-scale TE
  hsfpn_ratio: [0.25, 0.25] # DCT high-pass: zero the top-left 25% low-freq block
  hsfpn_patch: [8, 8]       # channel-path adaptive-pool target
  hsfpn_isdct: True         # use real DCT high-pass (needs torch_dct)
  hsfpn_residual: True      # residual around each HFP block for stable stacking
  # Lightweight-HFP: dw3x3+pw1x1 output projection (~8x fewer params/MACs), and
  # one DCT/IDCT pair shared across spatial & channel paths. Ablate by flipping
  # these two to 'conv3x3' / False.
  hsfpn_out_mode: 'dw_pw'   # 'conv3x3' (baseline) | 'dw_pw' | 'dw' | '1x1' | 'none'
  hsfpn_share_dct: True     # share one DCT/IDCT pair between spatial & channel

DEIMTransformer_LWGA:
  feat_channels: [128, 128]
  feat_strides: [16, 32]
  hidden_dim: 128
  num_levels: 2
  num_points: [6, 6]

  num_layers: 3
  eval_idx: -1

  # FFN
  dim_feedforward: 512

  # LWGA token self-attention
  lwga_stage: 3
  lwga_att_kernel: 11
  lwga_mlp_ratio: 2.0
  lwga_drop_path: 0.0
  lwga_act: 'gelu'
  lwga_norm_type: 'GN'
  lwga_min_hw: 2
  lwga_sort_by_ref: True
  lwga_isolate_dn: True

# ==============================================================================
# Optimizer with MoE parameter groups
#   v2 MoEBlock params match the same keywords (expert/router/shared_expert);
#   MoEBlock.norm (BN) is caught by the backbone norm/bn group (wd=0).
# ==============================================================================
optimizer:
  type: AdamW
  params:
    # Backbone norm/bn params
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0004
      weight_decay: 0.
    # Backbone MoE params (expert, router, shared_expert) - exclude norm/bn
    -
      params: '^(?=.*backbone)(?=.*(?:expert|router|shared_expert|gate))(?!.*norm|bn).*$'
      lr: 0.0004
    # Backbone other params (exclude norm/bn and MoE params)
    -
      params: '^(?=.*backbone)(?!.*norm|bn)(?!.*expert)(?!.*router)(?!.*shared_expert)(?!.*gate).*$'
      lr: 0.0004
    # Encoder/Decoder norm/bn/bias params
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0008
  betas: [0.9, 0.999]
  weight_decay: 0.0001

# Training Schedule (for UAVDT)
epoches: 160

flat_epoch: 7800
no_aug_epoch: 12
lr_gamma: 1.0

## MoE Loss Weight
moe_loss_weight: 0.01

## DataAug
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: [4, 78, 148]

  collate_fn:
    ema_restart_decay: 0.9999
    base_size_repeat: ~
    mixup_epochs: [4, 78]
    stop_epoch: 148
    copyblend_prob: 0.4
    copyblend_epochs: [4, 78]
    area_threshold: 100
    num_objects: 3
    with_expand: True
    expand_ratios: [0.1, 0.25]

DEIMCriterion:
  weight_dict: {loss_mal: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5,
                loss_paq_vfl: 1, loss_paq_bbox: 5, loss_paq_giou: 2}
  # PaQ-DETR quality-aware one-to-many auxiliary branch (ablation toggle).
  # Off by default in code; set paq_enable: True to turn on. Final decoder layer
  # always stays one-to-one; this adds an adaptive one-to-many loss at the
  # intermediate (aux) decoder layers only.
  paq_enable: True
  paq_gamma: 0.4          # s = IoU - gamma * cls_conf   (PaQ Eq. 6)
  paq_k: 4                # nominal top-k for adaptive positive count (Eq. 7)
  paq_l: 1                # min positives per GT
  paq_iou_thr: 0.0        # only consider queries with IoU > thr as candidates
  paq_layers: ~           # None = all intermediate aux layers; or list e.g. [0, 1]
  paq_start_epoch: 4      # align with mosaic/mixup start
  matcher:
    # new matcher
    change_matcher: True
    iou_order_alpha: 4.0
    matcher_change_epoch: 136
