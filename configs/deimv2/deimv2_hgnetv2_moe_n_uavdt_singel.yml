# ==============================================================================
# DEIMv2 with ES-MoE Backbone on UAVDT Dataset
# ==============================================================================
# Training Command:
#   CUDA_VISIBLE_DEVICES=0 python train.py \
#       -c /workspace/cpfs-data/deimv2/configs/deimv2/deimv2_hgnetv2_moe_n_uavdt.yml \
#       --use-amp --seed=0
#
# Multi-GPU Training:
#   CUDA_VISIBLE_DEVICES=0,1 torchrun --nproc_per_node=2 train.py \
#       -c /workspace/cpfs-data/deimv2/configs/deimv2/deimv2_hgnetv2_moe_n_uavdt.yml \
#       --use-amp --seed=0
# ==============================================================================

__include__: [
  '../dataset/uavdt_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/deimv2_moe.yml'
]

output_dir: ./outputs_1/deimv2_hgnetv2_moe_n_uavdt_shared

# ==============================================================================
# Override MoE Backbone Config (for UAVDT specific tuning)
# ==============================================================================
HGNetv2_MoE:
  name: 'B0'
  return_idx: [2, 3]
  freeze_at: -1
  freeze_norm: False
  pretrained: False
  use_lab: True
  # MoE specific parameters (ultra-lightweight)
  num_experts: 2
  top_k: 1
  use_shared_expert: True
  moe_stages: [2, 3]
  expert_expand_ratio: 1    # 超轻量：不扩展通道
  balance_loss_coeff: 1.0
  z_loss_coeff: 1.0

HybridEncoder:
  in_channels: [512, 1024]
  feat_strides: [16, 32]
  hidden_dim: 128
  use_encoder_idx: [1]
  dim_feedforward: 512
  expansion: 0.34
  depth_mult: 0.5
  version: 'dfine'

DEIMTransformer:
  feat_channels: [128, 128]
  feat_strides: [16, 32]
  hidden_dim: 128
  num_levels: 2
  num_points: [6, 6]
  num_layers: 3
  eval_idx: -1
  dim_feedforward: 512

# ==============================================================================
# Optimizer with MoE parameter groups
# ==============================================================================
optimizer:
  type: AdamW
  params:
    # Backbone norm/bn params
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0004
      weight_decay: 0.
    # Backbone MoE params (expert, router, shared_expert, gate) - exclude norm/bn
    -
      params: '^(?=.*backbone)(?=.*(?:expert|router|shared_expert|gate))(?!.*norm|bn).*$'
      lr: 0.0004
    # Backbone other params (exclude norm/bn and MoE params)
    -
      params: '^(?=.*backbone)(?!.*norm|bn)(?!.*expert)(?!.*router)(?!.*shared_expert)(?!.*gate).*$'
      lr: 0.0004
    # Encoder/Decoder norm/bn/bias params
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0008
  betas: [0.9, 0.999]
  weight_decay: 0.0001

# ==============================================================================
# Training Schedule (for UAVDT)
# ==============================================================================
epoches: 160

flat_epoch: 7800
no_aug_epoch: 12
lr_gamma: 1.0

## MoE Loss Weight
moe_loss_weight: 0.01

## DataAug
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: [4, 78, 148]

  collate_fn:
    ema_restart_decay: 0.9999
    base_size_repeat: ~
    mixup_epochs: [4, 78]
    stop_epoch: 148
    copyblend_prob: 0.4
    copyblend_epochs: [4, 78]
    area_threshold: 100
    num_objects: 3
    with_expand: True
    expand_ratios: [0.1, 0.25]

DEIMCriterion:
  matcher:
    change_matcher: True
    iou_order_alpha: 4.0
    matcher_change_epoch: 136
