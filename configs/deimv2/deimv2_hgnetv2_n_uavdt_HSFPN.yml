# ==============================================================================
# DEIMv2 + HGNetv2 B0 on UAVDT with HSFPN encoder (HFP replaces intra-scale TE)
#   Based on deimv2_hgnetv2_n_uavdt.yml; the intra-scale TransformerEncoder is
#   replaced by a stack of HFP (High Frequency Perception) blocks via
#   base/deimv2_encoder_HSFPN.yml.
#
#   Effect-first placement: HFP runs on the high-resolution level (use_encoder_idx
#   =[0] = stride-16, 40x40 for 640 input) where tiny-object high-frequency cues
#   are strongest, depth=2, isdct=True (real DCT high-pass).
#
#   Lightweight-HFP: the HS-FPN idea (DCT high-pass + spatial/channel masking) is
#   parameter-free; only the output projection carried cost. hsfpn_out_mode='dw_pw'
#   swaps the 3x3 output conv for a factored dw3x3+pw1x1 (~8x fewer params/MACs),
#   and hsfpn_share_dct=True shares one DCT/IDCT pair across the two paths.
#   Ablate vs the baseline by setting hsfpn_out_mode='conv3x3', hsfpn_share_dct=False.
#
#   ABLATION PAIR (arm A / baseline): this file uses hsfpn_out_mode='dw_pw'.
#     arm B (sibling): deimv2_hgnetv2_n_uavdt_HSFPN_dw.yml  -> hsfpn_out_mode='dw'
#       (drops the pw1x1 channel mix of the output projection; everything else
#        identical). Compare the two output_dir's to read the dw_pw vs dw trade.
#
#   Dependency: the DCT path (isdct=True) requires `torch_dct`:
#       pip install torch_dct
#
# Training Command:
#   CUDA_VISIBLE_DEVICES=0 python train.py \
#       -c /workspace/cpfs-data/deimv2/configs/deimv2/deimv2_hgnetv2_n_uavdt_HSFPN.yml \
#       --use-amp --seed=0
# ==============================================================================
__include__: [
  '../dataset/uavdt_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/deimv2_encoder_HSFPN.yml'
]

output_dir: ./outputs/deimv2_hgnetv2_n_uavdt_HSFPN_dw_pw_real_all

HGNetv2:
  name: 'B0'
  return_idx: [2, 3]
  freeze_at: -1
  freeze_norm: False
  pretrained: False
  use_lab: True

HybridEncoder_HSFPN:
  in_channels: [512, 1024]
  feat_strides: [16, 32]

  # intra
  hidden_dim: 128
  # HFP applied at the high-resolution level (stride-16, 40x40) for tiny-object
  # high-frequency enhancement (effect-first; baseline TE was at [1]=stride-32).
  use_encoder_idx: [0]
  num_encoder_layers: 1
  dim_feedforward: 512

  # cross
  expansion: 0.34
  depth_mult: 0.5

  version: 'dfine'

  # ---- HFP-specific ----
  hsfpn_depth: 1            # 2 HFP blocks replace the single intra-scale TE
  hsfpn_ratio: [0.25, 0.25] # DCT high-pass: zero the top-left 25% low-freq block
  hsfpn_patch: [8, 8]       # channel-path adaptive-pool target
  hsfpn_isdct: True         # use real DCT high-pass (needs torch_dct)
  hsfpn_residual: True      # residual around each HFP block for stable stacking
  # ---- Lightweight-HFP (idea-preserving simplification) ----
  # The HS-FPN idea (DCT high-pass + spatial/channel masking) is parameter-free;
  # the original 'conv3x3' output projection alone was ~100% of the block's
  # params/MACs. 'dw_pw' replaces it with a factored dw3x3+pw1x1+GN
  # (~8x fewer params, ~8x fewer MACs, same expressiveness shape). share_dct
  # computes the DCT high-pass once, shared by the spatial & channel paths
  # (identical masks, ~halves DCT runtime). Ablate by flipping these two.
  hsfpn_out_mode: 'dw_pw'   # 'conv3x3' (baseline) | 'dw_pw' | 'dw' | '1x1' | 'none'
  hsfpn_share_dct: True     # share one DCT/IDCT pair between spatial & channel

DEIMTransformer:
  feat_channels: [128, 128]
  feat_strides: [16, 32]
  hidden_dim: 128
  num_levels: 2
  num_points: [6, 6]

  num_layers: 3
  eval_idx: -1

  # FFN
  dim_feedforward: 512

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0004
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0004
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0008
  betas: [0.9, 0.999]
  weight_decay: 0.0001

# Increase to search for the optimal ema
epoches: 160 # 148 + 12

## Our LR-Scheduler
flat_epoch: 7800    # 4 + epoch // 2, e.g., 40 = 4 + 72 / 2
no_aug_epoch: 12
lr_gamma: 1.0

## Our DataAug
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: [4, 78, 148]   # list

  collate_fn:
    ema_restart_decay: 0.9999
    base_size_repeat: ~
    mixup_epochs: [4, 78]
    stop_epoch: 148
    copyblend_prob: 0.4
    copyblend_epochs: [4, 78]   # CP half
    area_threshold: 100
    num_objects: 3
    with_expand: True
    expand_ratios: [0.1, 0.25]

DEIMCriterion:
  matcher:
    # new matcher
    change_matcher: True
    iou_order_alpha: 4.0
    matcher_change_epoch: 136
